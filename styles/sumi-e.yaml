# 画風：水墨画（forge.sh -s sumi-e）
name: "水墨画"
line: "画風: 水墨画のカラー漫画（墨の濃淡と滲みで描く。和紙の質感、筆致の勢いとかすれ、余白を活かす構図。色は墨の階調が主で、差し色の朱をごく限られた箇所にのみ使う）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "◎ 2026-10-18 試し焼き。ほぼ墨の濃淡になり、キャラの髪の色も淡くなる"
notes:
  - "ピクセルアートなど質感がキャラの一部のキャラは、その質感が唯一の色になって決まる"
