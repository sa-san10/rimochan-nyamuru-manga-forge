# 画風：<名前>（forge.sh -s <ファイル名から .yaml を除いたもの>）
# このファイルをコピーして <英小文字とハイフンの名前>.yaml で保存する。_ で始まるファイルは一覧に出ない。
# 値はすべて1行で、ダブルクォート「"」で囲む。値の中にダブルクォートは使わない（「」を使う）。
#
# name   : 一覧に出る名前。forge.sh -s にはこの名前を渡してもよい（必須）
# line   : OMNY の meta.style_notes の先頭に入る画風の行（必須）。「画風: 」で始め、
#          最後は「。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンを
#          この画風に合わせて全編で統一する」で締める（生成プロンプトの手順11と同じ形）
#          大きく変えたいときは「画材＋支持体（紙など）」を書く
# memo   : 依頼文の【この作品について】に足す念押し（任意。-m と併用すると両方入る）
# tested : 試し焼きの記録（任意。いつ・何で試したか）
# notes  : 相性・注意など人間向けのメモ（任意。作画AIには渡さない）
name: "<名前>"
line: "画風: <画材・支持体・線・塗り・質感>。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: ""
notes:
  - ""
