# 画風：クレヨン（forge.sh -s crayon）
name: "クレヨン"
line: "画風: クレヨン画のカラー漫画（子どもの絵本のようなクレヨン・オイルパステル画。ざらざらした画用紙の目に乗るワックスの粒、塗りムラとかすれ、はみ出す太い手描きの輪郭線、重ね塗りの色の混ざり、白い紙目が透ける粗い塗り。素朴であたたかい手描き感を最優先）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "○ 2026-10-18 試し焼き（2作品）。紙目・塗りムラ・ガタガタの枠線は出る。顔と目はアニメ寄りのまま"
notes:
  - "素朴であたたかい手描き感。可憐さ・繊細さを出したいときはソフトパステルのほうが向く"
