# 画風：ちぎり絵（forge.sh -s chigiri-e）
name: "ちぎり絵"
line: "画風: ちぎり絵のカラー漫画（手でちぎった色和紙を貼り重ねたコラージュ。絵の具・筆は一切使わない。ちぎった縁に白くけばだつ和紙の繊維、薄い和紙が重なって透ける色、貼りムラと紙の段差、素朴で温かい色面。輪郭線は描かず紙の縁で形を作る）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "旧形式（meta.format）で試し焼き済み・2026-08"
notes:
  - "「絵の具・筆は一切使わない」の念押しが必須（画風の行に入れてある）"
