# 画風：ステンドグラス（forge.sh -s stained-glass）
name: "ステンドグラス"
line: "画風: ステンドグラスのカラー漫画（鉛の黒い縁＝ケイムで区切られた色ガラスの面。背後からの透過光で輝く彩色、ガラスの気泡と筋の質感、教会の窓のような荘厳であたたかい光。空も木も水も色ガラスのピースで構成し、グラデーションはガラス片の並びで作る）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "○ 2026-10-18 試し焼き。背景と服がガラスの区切りになる。顔はアニメのまま"
