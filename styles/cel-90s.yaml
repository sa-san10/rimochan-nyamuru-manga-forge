# 画風：90年代セル画（forge.sh -s cel-90s）
name: "90年代セル画"
line: "画風: 90年代のテレビアニメのセル画のカラー漫画（色数の少ないベタ塗りのセル塗り。影は境目のくっきりした暗い色1段だけ。太めで均一な黒い主線。強いデフォルメ：大きくシンプルな目で瞳は単純な形とベタ、ハイライトは白い丸1〜2個。鼻は小さな線か点。髪は大きなかたまりで描いて毛の細い線を描かず、髪のハイライトは単純な形のベタ1つまで。手も簡単な形。表情は大げさにはっきり。頭身はふつうでちびキャラにしない。グラデーション・つや・細かいハイライト・テクスチャ・質感の描き込み・写実的な陰影は入れない。背景もセル画の背景のように色数少なめのベタ塗りで簡略に描く）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "リファレンス画像は顔立ち・髪型・髪の色・服の形と色を写すためだけに使い、参照の細かい塗り・つや・写実的な描き込みはまねしない。誰か分かるようにしたまま、画風だけ90年代セル画に置きかえる。指は片手5本。bg:0 のコマの背景は、シーンの感情色をパステルにした淡い平らなベタに、デコラの模様（小さな星・ハート・キャンディ・リボン・カラフルなヘアピン・ボタン・水玉）を効果の模様として小さくまばらに10〜16個ほど散らす。模様もベタ塗り・色数少なめ・濃い色の主線で、混みすぎず、人物の後ろはすっきり空ける"
tested: ""
notes:
  - "元はユーザーがMV用に書いた画風の指定（2026-10-18）。ユーザーの言葉：「アニメ風の画像書き込みすぎでちょっと実写とぱっと見違い分からないから色数減らして９０年代アニメ風にセル塗りと強いデフォルメかけて」"
  - "元の指定では背景は「場所や家具を描かず、パステルのベタにデコラ小物を散らす」だった。漫画ではコマごとの bg（場所をどれだけ描くか）を守るので、デコラ背景は bg:0 のコマだけにした。bg:1・bg:2 のコマは場所を描くが、セル画の背景のようにベタ塗りで簡略にする。全コマをデコラ背景にしたい作品は、ネームで全コマ bg:0 にする"
  - "元の指定にあった【背景の色】（背景の主な色）は作品ごとに違うので、ここには入れていない。決めたいときは -m か、ネームの style_notes に書く"
  - "画材の質感を足すほかの画風と違い、塗りを減らす方向の画風。だから memo に「アニメ塗りは使わない」は入れていない"
