# 画風：フェルト手芸（forge.sh -s felt）
name: "フェルト手芸"
line: "画風: 羊毛フェルト手芸のカラー漫画（立体的なフェルト手芸作品を撮影したような質感。ふわふわの羊毛繊維の毛羽立ち、フェルト布の縫い目と刺繍ステッチ、手芸作品の柔らかい落ち影。背景の空も木も水も全部フェルトと布で作られている。デジタルのなめらかな塗りは禁止）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "◎ 2026-10-18 試し焼き。キャラごとフェルト人形になる"
