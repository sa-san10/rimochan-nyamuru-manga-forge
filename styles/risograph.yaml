# 画風：リソグラフ（forge.sh -s risograph）
name: "リソグラフ"
line: "画風: リソグラフ（レトロ孔版印刷）のカラー漫画（特色インク2〜3色だけの重ね刷りで、重なりで中間色を作る。はっきり見える網点＝ハーフトーンドットの階調、色版のわずかなレジストレーションずれ、インクのかすれとムラ、ざらっとした再生紙の地色。ZINEの1ページのような風合い）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "○ 2026-10-18 試し焼き。網点とざらつきは出るが、色は2〜3色に絞れない"
