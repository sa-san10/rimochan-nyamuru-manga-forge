# 画風：ソフトパステル（forge.sh -s soft-pastel）
name: "ソフトパステル"
line: "画風: パステル画のカラー漫画（ソフトパステル・粉パステル。粉っぽい顔料がざらついた紙の目に乗り、指でぼかしたやわらかい階調、ふんわり淡く光をふくんだ色、輪郭もやわらかくにじむ。白い紙の目が透ける軽やかな塗り。ハイライトは白パステルを重ねて置く。クレヨン／オイルパステルのワックス質のテカリやゴツい太線は使わない）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "△ 2026-10-18 試し焼き。粉っぽさは少しだけで、アニメ塗りに近い"
notes:
  - "レース・リボン・ガラス瓶・ぬいぐるみ・お菓子など「可愛いもの」の描写が抜群"
  - "やさしいお見舞い・絵本的な話と相性がよい"
