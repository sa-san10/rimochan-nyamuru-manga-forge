# 画風：木版画（forge.sh -s woodblock）
name: "木版画"
line: "画風: 多色木版画のカラー漫画（浮世絵・新版画の趣。版木の木目が透ける平坦な色面、主版の力強い彫りの輪郭線、色版のわずかな版ずれ、和紙にインクが乗る質感、ばれんの摺りムラ。空は一文字ぼかし風のグラデーション）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "○ 2026-10-18 試し焼き。和紙の地・平らな色・太い輪郭線"
notes:
  - "新版画のようで特に決まる"
