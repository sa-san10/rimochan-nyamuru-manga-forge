# 画風：油彩厚塗り（forge.sh -s oil-impasto）
name: "油彩厚塗り"
line: "画風: 油彩の厚塗り（インパスト）のカラー漫画（キャンバスの織り目、パレットナイフと硬い筆のはっきりした筆跡、絵の具の盛り上がりが作る立体的な凹凸と艶、混色のうねり。なめらかなグラデーション禁止、筆跡が見えるタッチ主体で画面を作る）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "旧形式（meta.format）で試し焼き済み・2026-08"
