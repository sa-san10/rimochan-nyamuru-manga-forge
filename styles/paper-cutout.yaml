# 画風：切り絵コラージュ（forge.sh -s paper-cutout）
name: "切り絵コラージュ"
line: "画風: 切り絵コラージュのカラー漫画（色画用紙を切って貼った質感。平面的な色面、紙の切り口のエッジとわずかな落ち影、重ねた紙の段差、テクスチャは紙。グラデーションを使わず色面の組み合わせで表現する）。キャラクターデザイン・線のタッチ・デフォルメ度・目や髪の描き方・効果トーンをこの画風に合わせて全編で統一する"
memo: "アニメ塗り・デジタルのなめらかな塗りは使わない。中途半端にきれいにしない"
tested: "旧形式（meta.format）で試し焼き済み・2026-08"
